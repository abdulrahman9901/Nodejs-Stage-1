services:
  mongodb:
    image: mongo:7
    container_name: taskhub-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok
          }
        "
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
